server:
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: fixmate-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
      file-size-threshold: 2KB
  datasource:
    url: "${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fixmate}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC}}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL:http://localhost:5173}}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
  upload:
    directory: ${FIXMATE_UPLOAD_DIR:../uploads}
    max-file-size-bytes: ${FIXMATE_MAX_IMAGE_SIZE_BYTES:5242880}
    max-files-per-request: ${FIXMATE_MAX_IMAGES_PER_REQUEST:5}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
